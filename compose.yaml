name: many-notes

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    ports:
      - ${APP_PORT:-6683}:8080
